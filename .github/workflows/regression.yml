
name: Nexora Regression Tests

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  regression:
    name: Run Nexora Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run TestNG regression suite
        run: mvn clean test -Dsurefire.suiteXmlFiles=testng-regression.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14
